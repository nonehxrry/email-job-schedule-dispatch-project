services:
  - type: web
    name: reachinbox-email-scheduler
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: CLIENT_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: 5
      - key: EMAIL_SEND_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 50
      - key: DEFAULT_SENDER_EMAIL
        value: outreach@reachinbox.ai
      - key: DEFAULT_SENDER_NAME
        value: ReachInbox SDR
